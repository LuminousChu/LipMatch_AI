<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <!-- LipMatch AI 問答流程圖（2026-11-09）：三層＝請求進來 → 檢索與生成 → 輸出與紀錄；配色沿用系統畫面的綠色系 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b8468"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#c9d6c5;stroke-width:1.5}
      .key{fill:#5f7d5b;stroke:none}
      .model{fill:#fbf1f3;stroke:#d9a6b3;stroke-width:1.5}
      .side{fill:#f6f3ec;stroke:#d8cfbd;stroke-width:1.5}
      .group{fill:#eef3ec;stroke:#c9d6c5;stroke-width:1.5}
      .t{font-size:17px;font-weight:700;fill:#2b2f2a}
      .tw{font-size:17px;font-weight:700;fill:#ffffff}
      .s{font-size:13.5px;fill:#5b6358}
      .sw{font-size:13.5px;fill:#e7efe4}
      .lab{font-size:13px;fill:#6b8468;font-weight:600}
      .layer{font-size:13px;fill:#9aa596;letter-spacing:2px;font-weight:700}
      .line{stroke:#6b8468;stroke-width:1.8;fill:none}
      .dash{stroke:#b7a98c;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfaf7"/>

  <!-- 第一層：請求進來 -->
  <text x="40" y="34" class="layer">① 請求進來</text>
  <rect x="40" y="48" width="190" height="78" rx="12" class="box"/>
  <text x="135" y="82" text-anchor="middle" class="t">使用者提問</text>
  <text x="135" y="106" text-anchor="middle" class="s">中文描述需求</text>

  <rect x="270" y="48" width="200" height="78" rx="12" class="box"/>
  <text x="370" y="82" text-anchor="middle" class="t">前端</text>
  <text x="370" y="106" text-anchor="middle" class="s">TypeScript 單頁 · nginx</text>

  <rect x="510" y="48" width="220" height="78" rx="12" class="box"/>
  <text x="620" y="82" text-anchor="middle" class="t">FastAPI 後端</text>
  <text x="620" y="106" text-anchor="middle" class="s">登入 · CSRF · 對話擁有權</text>

  <rect x="770" y="48" width="230" height="78" rx="12" class="box"/>
  <text x="885" y="76" text-anchor="middle" class="t">需求解析</text>
  <text x="885" y="98" text-anchor="middle" class="s">底調 · 色系 · 情境 · 過敏</text>
  <text x="885" y="117" text-anchor="middle" class="s">辨識 prompt injection</text>

  <rect x="1040" y="48" width="200" height="78" rx="12" class="key"/>
  <text x="1140" y="82" text-anchor="middle" class="tw">路由判斷</text>
  <text x="1140" y="106" text-anchor="middle" class="sw">問答 · 範圍外 · 商品</text>

  <line x1="230" y1="87" x2="268" y2="87" class="line" marker-end="url(#arrow)"/>
  <line x1="470" y1="87" x2="508" y2="87" class="line" marker-end="url(#arrow)"/>
  <line x1="730" y1="87" x2="768" y2="87" class="line" marker-end="url(#arrow)"/>
  <line x1="1000" y1="87" x2="1038" y2="87" class="line" marker-end="url(#arrow)"/>

  <!-- 分支：範圍外／商品 -->
  <path d="M1190,126 V168" class="line" marker-end="url(#arrow)"/>
  <text x="1198" y="152" class="lab">範圍外／商品</text>
  <rect x="1040" y="170" width="200" height="70" rx="12" class="side"/>
  <text x="1140" y="200" text-anchor="middle" class="t">說明範圍</text>
  <text x="1140" y="224" text-anchor="middle" class="s">改給唇彩色系方向</text>

  <!-- 主線：唇彩問答 -->
  <path d="M1080,126 V150 H300 V286" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="143" class="lab">唇彩問答（一句多個需求先拆開）</text>

  <!-- 第二層：檢索與生成 -->
  <text x="40" y="276" class="layer">② 檢索與生成</text>
  <rect x="40" y="288" width="510" height="190" rx="16" class="group"/>
  <text x="62" y="316" class="lab">混合檢索</text>

  <rect x="60" y="330" width="250" height="60" rx="10" class="box"/>
  <text x="185" y="366" text-anchor="middle" class="t">向量路</text>

  <rect x="60" y="402" width="250" height="60" rx="10" class="box"/>
  <text x="185" y="438" text-anchor="middle" class="t">關鍵詞路</text>

  <rect x="350" y="360" width="180" height="72" rx="10" class="key"/>
  <text x="440" y="402" text-anchor="middle" class="tw">RRF 合併</text>

  <path d="M310,360 H330 V385 H348" class="line" marker-end="url(#arrow)"/>
  <path d="M310,432 H330 V408 H348" class="line" marker-end="url(#arrow)"/>

  <rect x="590" y="360" width="170" height="72" rx="12" class="box"/>
  <text x="675" y="402" text-anchor="middle" class="t">挑選證據</text>

  <rect x="800" y="350" width="210" height="92" rx="12" class="model"/>
  <text x="905" y="378" text-anchor="middle" class="t">本地 LLM 生成</text>
  <text x="905" y="401" text-anchor="middle" class="s">gemma-4-12B · llama.cpp</text>
  <text x="905" y="422" text-anchor="middle" class="s">單行 JSON · 每句標證據</text>

  <rect x="1050" y="350" width="190" height="92" rx="12" class="key"/>
  <text x="1145" y="378" text-anchor="middle" class="tw">後處理核對</text>
  <text x="1145" y="401" text-anchor="middle" class="sw">逐句核對引用與依據</text>
  <text x="1145" y="422" text-anchor="middle" class="sw">無依據的句子不交付</text>

  <line x1="530" y1="396" x2="588" y2="396" class="line" marker-end="url(#arrow)"/>
  <line x1="760" y1="396" x2="798" y2="396" class="line" marker-end="url(#arrow)"/>
  <line x1="1010" y1="396" x2="1048" y2="396" class="line" marker-end="url(#arrow)"/>

  <!-- 第三層：輸出與紀錄 -->
  <text x="40" y="518" class="layer">③ 輸出與紀錄</text>
  <rect x="590" y="530" width="170" height="72" rx="12" class="side"/>
  <text x="675" y="560" text-anchor="middle" class="t">進度提示</text>
  <text x="675" y="584" text-anchor="middle" class="s">0.2～0.5 秒顯示來源</text>
  <path d="M675,432 V528" class="dash" marker-end="url(#arrow)"/>

  <rect x="800" y="530" width="210" height="72" rx="12" class="side"/>
  <text x="905" y="560" text-anchor="middle" class="t">斷線降級</text>
  <text x="905" y="584" text-anchor="middle" class="s">改列原文段落並標示</text>
  <path d="M905,442 V528" class="dash" marker-end="url(#arrow)"/>
  <text x="913" y="492" class="lab" fill="#b7a98c">模型連不上</text>

  <rect x="1050" y="530" width="190" height="72" rx="12" class="box" style="stroke:#5f7d5b;stroke-width:2"/>
  <text x="1145" y="560" text-anchor="middle" class="t">回答</text>
  <text x="1145" y="584" text-anchor="middle" class="s">每句附出處＋限制</text>
  <path d="M1145,442 V528" class="line" marker-end="url(#arrow)"/>

  <rect x="40" y="636" width="1200" height="52" rx="12" class="group"/>
  <text x="640" y="668" text-anchor="middle" class="s"><tspan class="lab">請求紀錄　</tspan>問題 · 偏好 · 檢索結果 · 模型輸出 · 回答 · 引用 · 耗時 · Token（取不到記未知）· 錯誤 · 版本</text>
  <path d="M1145,602 V634" class="line" marker-end="url(#arrow)"/>
  <path d="M905,602 V634" class="line" marker-end="url(#arrow)"/>
  <path d="M1240,205 H1262 V662 H1243" class="line" marker-end="url(#arrow)"/>
</svg>
