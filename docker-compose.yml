# LipMatch AI — 三服務：frontend / backend / db
# 連接埠只綁 127.0.0.1；號碼避開參考專案 lipstick-rag 的 8100 / 8180，可在 .env 調整。
# 同時跑多份時不可共用測試 DB：請在各自的 .env 設定不同的 COMPOSE_PROJECT_NAME
# （它優先於下方的 name），容器與 volume 名稱就會分開；連接埠也要錯開。
name: lipmatch

services:
  db:
    # PostgreSQL 17 + pgvector 0.8.0（同一服務）
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lipmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lipmatch}
      # 後端專用的非超級使用者帳號，由 db/init/02_app_role.sh 建立
      APP_DB_USER: ${APP_DB_USER:-lipmatch_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?請在 .env 設定 APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # 預設不對外開放資料庫；需要用工具連線時再取消註解
    # ports:
    #   - "127.0.0.1:${DB_PORT:-5452}:5432"

  backend:
    build: ./backend
    environment:
      # 後端（含啟動時的遷移）只拿到非超級使用者帳號；管理帳號密碼不傳進後端容器
      DATABASE_URL: postgresql://${APP_DB_USER:-lipmatch_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-lipmatch}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # DEC-10：session cookie＋CSRF。本機 http 不能用 Secure cookie；遠端 HTTPS 必須設為 true
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # 允許發出修改請求的來源（瀏覽器網址列的 scheme://host:port），逗號分隔
      APP_ORIGINS: ${APP_ORIGINS:-http://127.0.0.1:8280,http://localhost:8280}
      # 後端前面有 nginx，登入限流採信 nginx 設定的 X-Real-IP
      TRUST_PROXY_HEADERS: "true"
      LOGIN_MAX_FAILURES_PER_USER: ${LOGIN_MAX_FAILURES_PER_USER:-5}
      LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-20}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 就緒檢查：資料庫可查詢、pgvector 可用、遷移已套用、帳號非超級使用者才算健康
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8200}:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8280}:80"
    restart: unless-stopped

volumes:
  pgdata:
