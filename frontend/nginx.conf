# 前端靜態檔快取策略：每次都向伺服器重新驗證（ETag／Last-Modified，沒變就回 304），
# 避免更新前端後瀏覽器以 Last-Modified 推測快取、繼續用舊的 ES 模組（S9 實機遇過 pages/result.js 沿用舊版）。
# /api/ 不由 nginx 加，交給後端決定。
# 用 map 在 server 層統一加，不在 location 內寫 add_header（location 內只要有 add_header 就會整組覆蓋上層的安全標頭）。
map $uri $lipmatch_cache_control {
  default  "no-cache";
  ~^/api/  "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # 安全標頭：只允許同源的腳本與樣式，禁止被嵌入框架
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # 值為空字串時 nginx 不輸出這個標頭（即 /api/）
  add_header Cache-Control $lipmatch_cache_control;

  location /api/ {
    proxy_pass http://backend:8000;
    # 由 nginx 填入真實來源 IP（覆蓋用戶端自帶的同名標頭），供登入限流使用
    proxy_set_header X-Real-IP $remote_addr;
    # 送出問題要等模型生成（實測每題 14～53 秒）；前端送問題的逾時 130 秒，比這裡長，讓這裡先回 504
    proxy_read_timeout 120s;
  }

  location / { try_files $uri /index.html; }
}
